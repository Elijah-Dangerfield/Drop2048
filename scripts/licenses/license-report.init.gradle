/*
 * Generates docs/store/licenses.md. Run it, do not read it as configuration:
 *
 *   ./gradlew -I scripts/licenses/license-report.init.gradle \
 *       :apps:compose:licenseReport --no-configuration-cache
 *
 * Why an init script rather than a plugin on the shared build, and why Groovy
 * rather than Kotlin, are both written up in docs/store/licenses.md. The short
 * version: a licence report is a release artefact, not a build input, so it has
 * no business on the classpath of every detekt and screenshot-test run; and the
 * Kotlin version of this file hit a compiler ICE on a local data class inside
 * the doLast lambda, which is the same family as ORCHESTRATION L62.
 *
 * It reads :apps:compose's releaseRuntimeClasspath, which is exactly the set of
 * external modules inside the shipped Android binary, then resolves each
 * module's POM and reads the <licenses> block out of it. A module whose POM
 * declares nothing comes out as UNDECLARED rather than being guessed at.
 */
gradle.projectsEvaluated {
    // An init script is applied to every build in the composite, and
    // `build-logic` is included via `includeBuild`. Without this guard the
    // script tries to look up `:apps:compose` inside `build-logic` and fails the
    // whole build before anything is configured.
    if (gradle.parent != null) return
    def target = gradle.rootProject.findProject(':apps:compose')
    if (target == null) return

    target.tasks.register('licenseReport') {
        group = 'reporting'
        description = 'Writes docs/store/licenses.md from the Android release runtime classpath.'

        doLast {
            def rootDir = gradle.rootProject.projectDir
            def outputFile = new File(rootDir, 'docs/store/licenses.md')

            def modules = target.configurations
                    .getByName('releaseRuntimeClasspath')
                    .incoming.resolutionResult.allComponents
                    .collect { it.moduleVersion }
                    // `unspecified` is Gradle's version for a project dependency,
                    // so this is how our own 50-odd modules are dropped. Filtering
                    // on the group prefix instead would break the day a module is
                    // renamed.
                    .findAll { it != null && it.group && it.version != 'unspecified' }
                    .unique { "$it.group:$it.name" }
                    .sort { "$it.group:$it.name" }

            def pomDeps = modules.collect {
                target.dependencies.create("${it.group}:${it.name}:${it.version}@pom")
            }
            def detached = target.configurations.detachedConfiguration(pomDeps as Dependency[])
            detached.transitive = false

            def pomFiles = [:]
            detached.resolvedConfiguration.lenientConfiguration.artifacts.each { artifact ->
                def id = artifact.moduleVersion.id
                pomFiles["${id.group}:${id.name}"] = artifact.file
            }

            def licensesFor = { pom ->
                if (pom == null || !pom.isFile()) return []
                def text = pom.getText('UTF-8')
                def block = (text =~ /(?s)<licenses>(.*?)<\/licenses>/)
                if (!block.find()) return []
                def found = []
                def each = (block.group(1) =~ /(?s)<license>(.*?)<\/license>/)
                while (each.find()) {
                    def body = each.group(1)
                    def nameMatch = (body =~ /(?s)<name>(.*?)<\/name>/)
                    def urlMatch = (body =~ /(?s)<url>(.*?)<\/url>/)
                    def name = nameMatch.find() ? nameMatch.group(1).trim() : ''
                    def url = urlMatch.find() ? urlMatch.group(1).trim() : ''
                    if (name) found << [name: name, url: url]
                }
                return found
            }

            def rows = modules.collect { module ->
                def coordinate = "${module.group}:${module.name}"
                [
                        coordinate: coordinate,
                        version   : module.version,
                        licenses  : licensesFor(pomFiles[coordinate]),
                ]
            }

            def tally = [:]
            rows.each { row ->
                def names = row.licenses ? row.licenses.collect { it.name } : ['UNDECLARED']
                names.each { tally[it] = (tally[it] ?: 0) + 1 }
            }
            def tallyRows = tally.entrySet().sort { -it.value }

            def out = new StringBuilder()
            out << "<!-- GENERATED by scripts/licenses/license-report.init.gradle. Do not hand-edit the tables. -->\n"
            out << "# Third-party licences\n\n"
            out << "Generated from `:apps:compose`'s `releaseRuntimeClasspath`, which is the exact set of\n"
            out << "external modules that ship inside the Android release binary. Licence strings are read out\n"
            out << "of each module's published POM, not inferred from a name.\n\n"
            out << "Regenerate with:\n\n"
            out << "```\n"
            out << "./gradlew -I scripts/licenses/license-report.init.gradle \\\n"
            out << "    :apps:compose:licenseReport --no-configuration-cache\n"
            out << "```\n\n"
            out << "## Why this is an init script and not a licence plugin\n\n"
            out << "`app.cash.licensee` and `com.mikepenz.aboutlibraries` are the obvious answers and neither is\n"
            out << "applied. A licence report is a **release artefact, not a build input**, nothing the app\n"
            out << "compiles depends on it, so putting a plugin on the shared build classpath makes every\n"
            out << "`detekt` run, every screenshot test and every CI job carry a configuration-time dependency\n"
            out << "for a file that is regenerated a few times a year. Both plugins are also written against\n"
            out << "the Android/JVM variant model, and this is a Kotlin Multiplatform build on Gradle 9 with the\n"
            out << "configuration cache on, so proving either one across the source-set graph is its own\n"
            out << "afternoon. The thing it would produce is the table below, read from the same POMs.\n\n"
            out << "**Cost, named rather than hidden:** nothing fails when this file goes stale. Regenerating it\n"
            out << "is a release-checklist step (`docs/store/release-checklist.md`), not something the build\n"
            out << "enforces. If a dependency is ever added under a licence that is not permissive, only a human\n"
            out << "running this will notice.\n\n"
            out << "**${rows.size()} external modules.** Licence totals:\n\n"
            out << "| Licence | Modules |\n|---|---|\n"
            tallyRows.each { out << "| ${it.key} | ${it.value} |\n" }
            out << "\n### Read the totals before you copy C11's sentence\n\n"
            out << "`LicensesScreen`'s KDoc says \"every dependency this app ships is Apache 2.0 or MIT\". The\n"
            out << "generated table says otherwise, and this is the single most useful thing this report\n"
            out << "produced. Every module listed under **Android Software Development Kit License** or **Play\n"
            out << "Core Software Development Kit Terms of Service** is on proprietary Google terms, not an OSI\n"
            out << "licence: the billing client, the whole `play-services-ads` tree, the UMP consent SDK and the\n"
            out << "in-app review SDK. They are perfectly fine to ship, that is what those terms are for, but\n"
            out << "they are not satisfied by an Apache-2.0 attribution block, and the in-app attribution copy\n"
            out << "should not claim they are.\n\n"
            out << "Two of them are worth a second look for a different reason: `play-services-location` and\n"
            out << "`play-services-places-placereport` arrive transitively under `play-services-ads`. **Nothing\n"
            out << "in this app requests a location permission** (`docs/store/data-safety.md` §2.8, §2.10), so no\n"
            out << "location is read, but their presence on the classpath is exactly the kind of thing that\n"
            out << "looks alarming in a dependency audit, and it is better to have the answer written down here\n"
            out << "than to work it out under review.\n\n"
            out << "**The four UNDECLARED rows are POM gaps, not licence gaps.** Guava\n"
            out << "(`guava`, `failureaccess`, `listenablefuture`) is Apache 2.0 and declares it in its README\n"
            out << "rather than in the published POM for these versions; `org.slf4j:slf4j-api` is MIT. Neither\n"
            out << "is a real ambiguity. They are left as UNDECLARED in the table on purpose: a generator that\n"
            out << "guesses is a generator you cannot trust on the row that matters.\n\n"
            out << "\n## Android release classpath\n\n"
            out << "| Module | Version | Licence |\n|---|---|---|\n"
            rows.each { row ->
                def cell = row.licenses
                        ? row.licenses.collect { it.url ? "[${it.name}](${it.url})" : it.name }.join('<br>')
                        : '**UNDECLARED**'
                out << "| `${row.coordinate}` | ${row.version} | ${cell} |\n"
            }
            out << "\n## Not covered by this report\n\n"
            out << "- **iOS Swift packages.** Declared in `apps/ios/iosApp.xcodeproj/project.pbxproj`, not in\n"
            out << "  Gradle, and they publish no POM. Today that is `sentry-cocoa` (MIT). Add `GoogleMobileAds`\n"
            out << "  here when the package lands: it ships under the Android Software Development Kit License\n"
            out << "  rather than an OSI licence, and its attribution requirements are its own.\n"
            out << "- **Fonts.** Fredoka and Nunito ship under the SIL Open Font License. The full text is\n"
            out << "  committed at `libraries/ui/licenses/Fredoka-OFL.txt` and `Nunito-OFL.txt`. Fonts are\n"
            out << "  resources rather than classpath entries, so nothing above sees them, and OFL attribution\n"
            out << "  is the one obligation in this project that a classpath scan structurally cannot find.\n"
            out << "- **The server and the admin console.** `:apps:server` and `:apps:admin` ship in no binary a\n"
            out << "  player installs, so their dependencies are not a store attribution obligation.\n"
            out << "- **Build-time only** dependencies: compiler plugins, KSP processors, detekt, Roborazzi and\n"
            out << "  the benchmark tooling are absent from `releaseRuntimeClasspath` by construction, which is\n"
            out << "  why this is the right classpath to read.\n"

            outputFile.parentFile.mkdirs()
            outputFile.setText(out.toString(), 'UTF-8')
            logger.lifecycle("Wrote ${rows.size()} modules to docs/store/licenses.md")
        }
    }
}
